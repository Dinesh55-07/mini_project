{% extends "base.html" %}
{% block content %}
<div class="card">

    <h1>
      <span

        data-text="📄 PDF Watermarking Suite"
        data-animate-on="hover"
        data-speed="50"
        data-max-iterations="10"

    <div class="dashboard-grid">
        <a href="/pdf-send" class="option-card pdf-card">
